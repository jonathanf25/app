[project]
name = "omnichannel-support"
version = "0.1.0"
description = "Plataforma omnichannel para atendimento humano, bots e integrações."
authors = ["Equipe de Atendimento <atendimento@example.com>"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.110",
    "uvicorn~=0.29",
    "pydantic~=2.6",
    "pydantic-settings~=2.2",
    "httpx~=0.27"
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2",
    "pytest-asyncio~=0.23"
]
